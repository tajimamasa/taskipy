# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Taskipy Test CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        include:
        - python-version: '3.7'
          os: ubuntu-22.04
        - python-version: '3.8'
          os: ubuntu-24.04
        - python-version: '3.9'
          os: ubuntu-24.04
        - python-version: '3.10'
          os: ubuntu-24.04
        - python-version: '3.11'
          os: ubuntu-24.04
        - python-version: '3.12'
          os: ubuntu-24.04
        - python-version: '3.13'
          os: ubuntu-24.04
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry
    - name: Install dependencies
      run: poetry install
    - name: Test
      run: poetry run task test

  python36:
    name: Python 3.6 compatibility
    runs-on: ubuntu-24.04
    container: python:3.6.15-bullseye
    steps:
    - uses: actions/checkout@v4
    - name: Install Python 3.6 compatible tools
      run: |
        python -m pip install --upgrade pip==21.3.1
        python -m pip install poetry==1.1.15
    - name: Install dependencies
      # Poetry 1.1 cannot read the lockfile generated by newer Poetry versions.
      run: |
        rm poetry.lock
        poetry install
    - name: Test and lint
      run: poetry run task test
